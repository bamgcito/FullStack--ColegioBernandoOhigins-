networks:
  colegio-net:
    driver: bridge

volumes:
  mysql_data:

services:

  # ── BASE DE DATOS ────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: "123456789."
      MYSQL_ROOT_HOST: "%"
    volumes:
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - colegio-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456789."]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ── EUREKA SERVER ────────────────────────────────────────────────────
  eureka-server:
    build:
      context: ./eureka-server
    container_name: eureka-server
    ports:
      - "8090:8090"
    networks:
      - colegio-net
    restart: unless-stopped

  # ── MICROSERVICIOS ───────────────────────────────────────────────────
  auth-service:
    build:
      context: ./authservice
    container_name: auth-service
    ports:
      - "8094:8094"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - colegio-net
    depends_on:
      eureka-server:
        condition: service_started
    restart: unless-stopped

  ms-usuarios:
    build:
      context: ./ms-usuarios
    container_name: ms-usuarios
    ports:
      - "8086:8086"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - colegio-net
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
    restart: unless-stopped

  ms-perfiles:
    build:
      context: ./ms-perfiles
    container_name: ms-perfiles
    ports:
      - "8087:8087"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - colegio-net
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
    restart: unless-stopped

  ms-cursos:
    build:
      context: ./ms-cursos
    container_name: ms-cursos
    ports:
      - "8088:8088"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - colegio-net
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
    restart: unless-stopped

  ms-asignatura:
    build:
      context: ./ms-asignatura
    container_name: ms-asignatura
    ports:
      - "8089:8089"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - colegio-net
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
    restart: unless-stopped

  ms-evaluaciones:
    build:
      context: ./ms-evaluaciones
    container_name: ms-evaluaciones
    ports:
      - "8091:8091"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - colegio-net
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
    restart: unless-stopped

  ms-notas:
    build:
      context: ./ms-notas
    container_name: ms-notas
    ports:
      - "8092:8092"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - colegio-net
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
    restart: unless-stopped

  ms-asistencia:
    build:
      context: ./ms-asistencia
    container_name: ms-asistencia
    ports:
      - "8093:8093"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - colegio-net
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
    restart: unless-stopped

  ms-comunicacion:
    build:
      context: ./ms-comunicacion
    container_name: ms-comunicacion
    ports:
      - "3000:3000"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: "123456789."
      DB_NAME: comunicacion_db
    networks:
      - colegio-net
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  # ── BFF ──────────────────────────────────────────────────────────────
  bff:
    build:
      context: ./BFF_original/BFF
    container_name: bff
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - colegio-net
    depends_on:
      eureka-server:
        condition: service_started
    restart: unless-stopped

  # ── API GATEWAY ──────────────────────────────────────────────────────
  apigateway:
    build:
      context: ./apigateway
    container_name: apigateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - colegio-net
    depends_on:
      bff:
        condition: service_started
    restart: unless-stopped

  # ── FRONTEND ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./proyecto-colegio
    container_name: frontend
    ports:
      - "8100:80"
    networks:
      - colegio-net
    depends_on:
      - apigateway
    restart: unless-stopped