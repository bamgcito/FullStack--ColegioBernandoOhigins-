<app-layout pageTitle="Anotaciones del Pupilo">
  <div class="animate-in">
    <div *ngIf="sinAlumno" class="content-card" style="text-align:center;padding:40px;color:#718096">
      No tienes alumnos asociados.
    </div>
    <ng-container *ngIf="!sinAlumno">
      <div class="content-card">
        <div class="content-card-header">
          <span class="content-card-title">Anotaciones — {{ pupiloNombre }}</span>
          <span class="badge badge-info">{{ anotaciones.length }}</span>
        </div>
        <div *ngIf="!anotaciones.length" style="text-align:center;padding:32px;color:#718096">Sin anotaciones registradas</div>
        <table class="data-table" *ngIf="anotaciones.length">
          <thead><tr><th>Tipo</th><th>Descripción</th><th>Fecha</th></tr></thead>
          <tbody>
            <tr *ngFor="let a of anotaciones">
              <td><span class="badge" [ngClass]="badge(a.tipo)">{{ a.tipo }}</span></td>
              <td style="font-size:12px;max-width:250px">{{ a.descripcion }}</td>
              <td style="font-size:12px;color:#718096">{{ a.fecha }}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </ng-container>
  </div>
</app-layout>
