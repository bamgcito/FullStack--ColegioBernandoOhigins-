<app-layout pageTitle="Notas del Pupilo">
  <div class="animate-in">
    <div class="content-card">
      <div class="content-card-header"><span class="content-card-title">Notas del Pupilo — {{ pupiloNombre }}</span><span class="badge badge-info">{{ items.length }}</span></div>
      <div class="content-card-body" *ngIf="items.length===0" style="text-align:center;color:#718096;padding:40px">Sin registros</div>
      <table class="data-table" *ngIf="items.length>0"><thead><tr><th>Detalle</th><th>Valor</th></tr></thead>
      <tbody><tr *ngFor="let i of items"><td style="font-size:12px;color:#718096">Registro #{{ i.id }}</td><td>{{ i.nota || i.estado || i.tipo || '—' }}</td></tr></tbody></table>
    </div>
  </div>
</app-layout>
