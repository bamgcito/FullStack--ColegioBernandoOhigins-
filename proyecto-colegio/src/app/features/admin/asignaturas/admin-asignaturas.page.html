<app-layout pageTitle="Gestión de Asignaturas">
  <div class="animate-in">
    <div class="page-actions">
      <div></div>
      <button class="btn-primary" (click)="showModal=true">
        <ion-icon name="add-outline"></ion-icon> Nueva Asignatura
      </button>
    </div>
    <div class="content-card">
      <div class="content-card-header">
        <span class="content-card-title">Asignaturas</span>
        <span class="badge badge-info">{{ asignaturas.length }}</span>
      </div>
      <table class="data-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Nombre</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let a of asignaturas; let i=index">
            <td style="color:#718096;font-size:12px">{{ i+1 }}</td>
            <td><strong>{{ a.nombre }}</strong></td>
          </tr>
          <tr *ngIf="asignaturas.length === 0">
            <td colspan="2" style="text-align:center;padding:32px;color:#718096">
              {{ loading ? 'Cargando...' : 'No hay asignaturas' }}
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</app-layout>

<div class="modal-overlay" *ngIf="showModal" (click)="showModal=false">
  <div class="modal-box" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <span class="content-card-title">Nueva Asignatura</span>
      <button class="btn-icon" (click)="showModal=false"><ion-icon name="close-outline"></ion-icon></button>
    </div>
    <div class="form-group">
      <label class="form-label">Nombre</label>
      <input class="form-input" [(ngModel)]="nuevoNombre" placeholder="Ej: Matemáticas" />
    </div>
    <div style="display:flex;gap:10px;margin-top:16px">
      <button class="btn-secondary" style="flex:1" (click)="showModal=false">Cancelar</button>
      <button class="btn-primary" style="flex:1;justify-content:center" (click)="crear()">Crear</button>
    </div>
  </div>
</div>
