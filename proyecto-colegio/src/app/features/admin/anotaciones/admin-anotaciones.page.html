<app-layout pageTitle="Anotaciones">
  <div class="animate-in">
    <div class="content-card">
      <div class="content-card-header"><span class="content-card-title">Anotaciones de Alumnos</span><span class="badge badge-info">{{ anotaciones.length }}</span></div>
      <table class="data-table"><thead><tr><th>Alumno</th><th>Tipo</th><th>Descripción</th><th>Fecha</th></tr></thead>
      <tbody><tr *ngFor="let a of anotaciones"><td>{{ getAlumno(a.alumnoId) }}</td><td><span class="badge" [ngClass]="badge(a.tipo)">{{ a.tipo }}</span></td><td style="font-size:12px;max-width:220px">{{ a.descripcion }}</td><td style="font-size:12px;color:#718096">{{ a.fecha }}</td></tr></tbody></table>
    </div>
  </div>
</app-layout>
