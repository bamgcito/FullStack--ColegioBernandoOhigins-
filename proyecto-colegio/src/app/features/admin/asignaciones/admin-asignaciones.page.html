<app-layout pageTitle="Asignaciones Docentes">
  <div class="animate-in">
    <div *ngIf="exitoMsg" style="background:#f0fff4;border:1px solid #c6f6d5;color:#2F855A;padding:10px 16px;border-radius:8px;margin-bottom:16px;font-weight:600;font-size:13px">{{ exitoMsg }}</div>
    <div class="page-actions"><div></div><button class="btn-primary" (click)="abrirModal()"><ion-icon name="add-outline"></ion-icon> Nueva Asignación</button></div>
    <div class="content-card">
      <div class="content-card-header"><span class="content-card-title">Asignaciones</span><span class="badge badge-info">{{ asignaciones.length }}</span></div>
      <table class="data-table"><thead><tr><th>Profesor</th><th>Curso</th><th>Asignatura</th></tr></thead>
      <tbody><tr *ngFor="let a of asignaciones"><td>{{ getProfesor(a.profesorId) }}</td><td><strong>{{ getCurso(a.cursoId) }}</strong></td><td>{{ getAsignatura(a.asignaturaId) }}</td></tr></tbody></table>
    </div>
  </div>
</app-layout>

<div class="modal-overlay" *ngIf="showModal" (click)="showModal=false"><div class="modal-box" (click)="$event.stopPropagation()">
  <div class="modal-header"><span class="content-card-title">Nueva Asignación</span><button class="btn-icon" (click)="showModal=false"><ion-icon name="close-outline"></ion-icon></button></div>
  <div class="form-group"><label class="form-label">Profesor</label><select class="form-select" [(ngModel)]="nuevo.rutProfesor"><option value="">Seleccionar...</option><option *ngFor="let p of profesores" [value]="p.rut">{{ p.nombre }} {{ p.apellido }}</option></select></div>
  <div class="form-group"><label class="form-label">Curso</label><select class="form-select" [(ngModel)]="nuevo.cursoId"><option [ngValue]="0">Seleccionar...</option><option *ngFor="let c of cursos" [ngValue]="c.id">{{ c.nivel }}{{ c.letra }}</option></select></div>
  <div class="form-group"><label class="form-label">Asignatura</label><select class="form-select" [(ngModel)]="nuevo.asignaturaId"><option [ngValue]="0">Seleccionar...</option><option *ngFor="let a of asignaturasList" [ngValue]="a.id">{{ a.nombre }}</option></select></div>
  <div *ngIf="errorMsg" style="color:#C53030;font-size:12px;margin-bottom:8px;font-weight:600">{{ errorMsg }}</div>
  <div style="display:flex;gap:10px;margin-top:16px"><button class="btn-secondary" style="flex:1" (click)="showModal=false">Cancelar</button><button class="btn-primary" style="flex:1;justify-content:center" (click)="crear()" [disabled]="!nuevo.rutProfesor || !nuevo.cursoId || !nuevo.asignaturaId">Crear</button></div>
</div></div>
