<app-layout pageTitle="Registro de Notas">
  <div class="animate-in">
    <div class="page-actions"><div></div>
      <button class="btn-primary" (click)="abrirModal()" [disabled]="!evaluacionId || !alumnos.length">
        <ion-icon name="add-outline"></ion-icon> Registrar Notas
      </button>
    </div>

    <div class="content-card" style="margin-bottom:16px">
      <div class="content-card-header"><span class="content-card-title">Seleccionar Evaluación</span></div>
      <div style="display:flex;gap:12px;flex-wrap:wrap">
        <div class="form-group" style="flex:1">
          <label class="form-label">Curso</label>
          <select class="form-select" [(ngModel)]="cursoId" (ngModelChange)="onCurso()">
            <option [ngValue]="0">— Seleccionar —</option>
            <option *ngFor="let c of cursos" [ngValue]="c.id">{{ c.nivel }}{{ c.letra }}</option>
          </select>
        </div>
        <div class="form-group" style="flex:1">
          <label class="form-label">Asignación</label>
          <select class="form-select" [(ngModel)]="asignacionId" (ngModelChange)="onAsignacion()" [disabled]="!asignaciones.length">
            <option [ngValue]="0">— Seleccionar —</option>
            <option *ngFor="let a of asignaciones" [ngValue]="a.id">{{ a.label }}</option>
          </select>
        </div>
        <div class="form-group" style="flex:1">
          <label class="form-label">Evaluación</label>
          <select class="form-select" [(ngModel)]="evaluacionId" (ngModelChange)="onEvaluacion()" [disabled]="!evaluaciones.length">
            <option [ngValue]="0">— Seleccionar —</option>
            <option *ngFor="let e of evaluaciones" [ngValue]="e.id">{{ e.nombre }}</option>
          </select>
        </div>
      </div>
    </div>

    <div class="content-card">
      <div class="content-card-header"><span class="content-card-title">Notas Registradas</span><span class="badge badge-info">{{ notas.length }}</span></div>
      <table class="data-table"><thead><tr><th>Alumno</th><th>Evaluación</th><th>Nota</th></tr></thead>
      <tbody>
        <tr *ngIf="!notas.length"><td colspan="3" style="text-align:center;padding:32px;color:#718096">Sin notas registradas</td></tr>
        <tr *ngFor="let n of notas">
          <td>{{ getAlumno(n.rutAlumno) }}</td>
          <td>{{ getEvaluacion(n.evaluacionId) }}</td>
          <td><span class="nota-chip" [ngClass]="notaClass(n.nota)">{{ n.nota }}</span></td>
        </tr>
      </tbody></table>
    </div>
  </div>
</app-layout>

<div class="modal-overlay" *ngIf="showModal" (click)="showModal=false">
  <div class="modal-box" (click)="$event.stopPropagation()" style="max-height:80vh;overflow-y:auto">
    <div class="modal-header">
      <span class="content-card-title">Registrar Notas</span>
      <button class="btn-icon" (click)="showModal=false"><ion-icon name="close-outline"></ion-icon></button>
    </div>
    <div *ngFor="let al of alumnos" class="form-group" style="display:flex;align-items:center;gap:12px">
      <span style="flex:1;font-size:14px">{{ al.nombre }} {{ al.apellido }}</span>
      <input class="form-input" type="number" min="1" max="7" step="0.1"
             [(ngModel)]="notasReg[al.id]" placeholder="—" style="width:80px;text-align:center">
    </div>
    <div *ngIf="guardado" style="color:#2F855A;margin:8px 0;font-size:13px;font-weight:600">Notas guardadas correctamente.</div>
    <div *ngIf="errorMsg" style="color:#C53030;margin:8px 0;font-size:13px;font-weight:600">{{ errorMsg }}</div>
    <div style="display:flex;gap:10px;margin-top:16px">
      <button class="btn-secondary" style="flex:1" (click)="showModal=false">Cerrar</button>
      <button class="btn-primary" style="flex:1;justify-content:center" (click)="guardar()">
        <ion-icon name="save-outline"></ion-icon> Guardar
      </button>
    </div>
  </div>
</div>
