<app-layout pageTitle="Dashboard — Profesor">
  <div class="animate-in">
    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-icon blue"><ion-icon name="clipboard-outline"></ion-icon></div>
        <div><div class="kpi-value">{{ asignaciones.length }}</div><div class="kpi-label">Mis Asignaciones</div></div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon orange"><ion-icon name="pencil-outline"></ion-icon></div>
        <div><div class="kpi-value">{{ anotaciones.length }}</div><div class="kpi-label">Anotaciones</div></div>
      </div>
    </div>
    <div class="dash-grid">
      <div class="content-card">
        <div class="content-card-header">
          <span class="content-card-title">Mis Cursos y Asignaturas</span>
        </div>
        <table class="data-table">
          <thead><tr><th>Asignatura</th><th>Curso</th></tr></thead>
          <tbody>
            <tr *ngIf="!asignaciones.length"><td colspan="2" style="text-align:center;padding:20px;color:#718096">Sin asignaciones</td></tr>
            <tr *ngFor="let a of asignaciones">
              <td><strong>{{ a.asignatura }}</strong></td>
              <td>{{ a.cursoNombre }}</td>
            </tr>
          </tbody>
        </table>
      </div>
      <div class="content-card">
        <div class="content-card-header">
          <span class="content-card-title">Últimas Anotaciones</span>
        </div>
        <table class="data-table">
          <thead><tr><th>Alumno</th><th>Tipo</th><th>Descripción</th></tr></thead>
          <tbody>
            <tr *ngFor="let a of anotaciones">
              <td>{{ a.rutAlumno }}</td>
              <td><span class="badge" [ngClass]="badge(a.tipo)">{{ a.tipo }}</span></td>
              <td style="font-size:12px">{{ a.descripcion }}</td>
            </tr>
            <tr *ngIf="anotaciones.length===0">
              <td colspan="3" style="text-align:center;padding:20px;color:#718096">Sin anotaciones</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</app-layout>
