<app-layout pageTitle="Mis Cursos">
  <div class="animate-in">
    <div *ngIf="loading" style="text-align:center;padding:40px;color:#718096">Cargando cursos...</div>
    <div *ngIf="!loading && !cursos.length" class="content-card" style="text-align:center;padding:40px;color:#718096">
      <ion-icon name="school-outline" style="font-size:48px;display:block;margin-bottom:12px"></ion-icon>
      No tienes cursos asignados.
    </div>
    <div *ngFor="let c of cursos" class="content-card">
      <div class="content-card-header">
        <span class="content-card-title">{{ c.cursoNombre }}</span>
        <span class="badge badge-info">{{ c.alumnos.length }} alumnos</span>
      </div>
      <table class="data-table">
        <thead><tr><th>Nombre</th><th>RUT</th></tr></thead>
        <tbody>
          <tr *ngIf="!c.alumnos.length"><td colspan="2" style="text-align:center;padding:20px;color:#718096">Sin alumnos</td></tr>
          <tr *ngFor="let a of c.alumnos">
            <td><strong>{{ a.nombre }} {{ a.apellido }}</strong></td>
            <td style="font-family:monospace;font-size:12px">{{ a.rut }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</app-layout>
