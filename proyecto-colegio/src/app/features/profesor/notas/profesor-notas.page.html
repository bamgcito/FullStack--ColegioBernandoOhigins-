<app-layout pageTitle="Registrar Notas">
  <div class="animate-in">
    <div class="content-card" style="margin-bottom:20px"><div class="content-card-body">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
        <div class="form-group"><label class="form-label">Asignación</label>
          <select class="form-select" [(ngModel)]="asignacionId" (change)="onAsig()">
            <option [ngValue]="0">Seleccionar...</option>
            <option *ngFor="let a of asignaciones" [ngValue]="a.id">{{ a.label }}</option>
          </select>
        </div>
        <div class="form-group"><label class="form-label">Evaluación</label>
          <select class="form-select" [(ngModel)]="evaluacionId" (change)="onEval()" [disabled]="!asignacionId">
            <option [ngValue]="0">Seleccionar...</option>
            <option *ngFor="let e of evaluaciones" [ngValue]="e.id">{{ e.nombre }} ({{ e.fecha }})</option>
          </select>
        </div>
      </div>
    </div></div>
    <div class="content-card" *ngIf="alumnos.length>0">
      <div class="content-card-header"><span class="content-card-title">Ingreso de Notas</span></div>
      <table class="data-table"><thead><tr><th>Alumno</th><th style="width:160px">Nota (1.0 — 7.0)</th><th>Preview</th></tr></thead>
      <tbody><tr *ngFor="let a of alumnos">
        <td><strong>{{ a.nombre }} {{ a.apellido }}</strong></td>
        <td><input type="number" class="form-input" min="1" max="7" step="0.1" [(ngModel)]="notasReg[a.rut]" style="max-width:120px" /></td>
        <td><span class="nota-chip" [ngClass]="notaClass(notasReg[a.rut])">{{ notasReg[a.rut] || '—' }}</span></td>
      </tr></tbody></table>
      <div style="padding:16px;border-top:1px solid #F0F4F8;display:flex;align-items:center;gap:12px">
        <button class="btn-primary" (click)="guardar()"><ion-icon name="save-outline"></ion-icon> Guardar Notas</button>
        <span *ngIf="guardado" style="color:#2F855A;font-weight:700;font-size:13px">Notas guardadas exitosamente</span>
        <span *ngIf="errorMsg" style="color:#C53030;font-weight:700;font-size:13px">{{ errorMsg }}</span>
      </div>
    </div>
  </div>
</app-layout>
