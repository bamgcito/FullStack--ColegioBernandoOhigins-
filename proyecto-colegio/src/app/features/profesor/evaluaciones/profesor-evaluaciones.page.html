<app-layout pageTitle="Evaluaciones">
  <div class="animate-in">
    <div *ngIf="exitoMsg" style="background:#f0fff4;border:1px solid #c6f6d5;color:#2F855A;padding:10px 16px;border-radius:8px;margin-bottom:16px;font-weight:600;font-size:13px">{{ exitoMsg }}</div>

    <div class="content-card" style="margin-bottom:20px">
      <div class="content-card-body">
        <div class="form-group">
          <label class="form-label">Asignación</label>
          <select class="form-select" [(ngModel)]="asignacionId" (change)="onAsignacion()">
            <option [ngValue]="0">Seleccionar...</option>
            <option *ngFor="let a of asignaciones" [ngValue]="a.id">{{ a.label }}</option>
          </select>
        </div>
      </div>
    </div>

    <div class="content-card" *ngIf="asignacionId">
      <div class="content-card-header">
        <span class="content-card-title">Evaluaciones</span>
        <button class="btn-primary" (click)="abrirModal()">
          <ion-icon name="add-outline"></ion-icon> Nueva Evaluación
        </button>
      </div>
      <table class="data-table">
        <thead><tr><th>Nombre</th><th>Fecha</th><th>Descripción</th></tr></thead>
        <tbody>
          <tr *ngFor="let e of evaluaciones">
            <td><strong>{{ e.nombre }}</strong></td>
            <td style="font-size:12px;color:#718096">{{ e.fecha }}</td>
            <td style="font-size:12px;color:#718096">{{ e.descripcion || '—' }}</td>
          </tr>
          <tr *ngIf="evaluaciones.length === 0">
            <td colspan="3" style="text-align:center;padding:32px;color:#718096">No hay evaluaciones para esta asignación</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</app-layout>

<div class="modal-overlay" *ngIf="showModal" (click)="showModal=false">
  <div class="modal-box" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <span class="content-card-title">Nueva Evaluación</span>
      <button class="btn-icon" (click)="showModal=false"><ion-icon name="close-outline"></ion-icon></button>
    </div>
    <div class="form-group">
      <label class="form-label">Nombre *</label>
      <input class="form-input" [(ngModel)]="nueva.nombre" placeholder="Ej: Prueba 1, Tarea 2..." />
    </div>
    <div class="form-group">
      <label class="form-label">Fecha *</label>
      <input class="form-input" type="date" [(ngModel)]="nueva.fecha" />
    </div>
    <div class="form-group">
      <label class="form-label">Descripción</label>
      <input class="form-input" [(ngModel)]="nueva.descripcion" placeholder="Opcional" />
    </div>
    <div *ngIf="errorMsg" style="color:#C53030;font-size:12px;margin-bottom:8px;font-weight:600">{{ errorMsg }}</div>
    <div style="display:flex;gap:10px;margin-top:16px">
      <button class="btn-secondary" style="flex:1" (click)="showModal=false">Cancelar</button>
      <button class="btn-primary" style="flex:1;justify-content:center" (click)="crear()" [disabled]="!nueva.nombre">Crear</button>
    </div>
  </div>
</div>
