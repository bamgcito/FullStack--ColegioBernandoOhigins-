<app-layout pageTitle="Mis Notas">
  <div class="animate-in">
    <div class="kpi-grid" style="grid-template-columns:repeat(2,1fr);max-width:360px;margin-bottom:20px">
      <div class="kpi-card"><div class="kpi-icon blue"><ion-icon name="stats-chart-outline"></ion-icon></div><div><div class="kpi-value">{{ promedio }}</div><div class="kpi-label">Promedio</div></div></div>
      <div class="kpi-card"><div class="kpi-icon teal"><ion-icon name="document-text-outline"></ion-icon></div><div><div class="kpi-value">{{ asignaturas.length }}</div><div class="kpi-label">Asignaturas</div></div></div>
    </div>
    <div *ngIf="asignaturas.length===0" class="content-card">
      <div class="content-card-body" style="text-align:center;color:#718096;padding:40px">Sin notas registradas aún</div>
    </div>
    <div class="accordion-item" *ngFor="let a of asignaturas">
      <div class="accordion-header" [class.open]="isOpen(a.id)" (click)="toggle(a.id)">
        <div style="display:flex;align-items:center;gap:10px">
          <ion-icon name="book-outline" style="color:#1E3A5F;font-size:16px"></ion-icon>
          <span>{{ a.nombre }}</span>
          <span class="nota-chip" [ngClass]="notaClass(a.promedio)" style="margin-left:8px">Prom. {{ a.promedio }}</span>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-size:12px;color:#718096;font-weight:500">{{ a.notas.length }} evaluaciones</span>
          <ion-icon name="chevron-down-outline" class="accordion-arrow" [class.open]="isOpen(a.id)"></ion-icon>
        </div>
      </div>
      <div class="accordion-body" *ngIf="isOpen(a.id)">
        <table class="data-table">
          <thead><tr><th>Evaluación</th><th>Fecha</th><th>Nota</th></tr></thead>
          <tbody>
            <tr *ngFor="let n of a.notas">
              <td><strong>{{ n.evalNombre }}</strong></td>
              <td style="font-size:12px;color:#718096">{{ n.fecha }}</td>
              <td><span class="nota-chip" [ngClass]="notaClass(n.nota)">{{ n.nota }}</span></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</app-layout>
