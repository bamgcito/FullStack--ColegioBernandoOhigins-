<app-layout pageTitle="Mi Asistencia">
  <div class="animate-in">
    <div class="kpi-grid" style="margin-bottom:20px">
      <div class="kpi-card"><div class="kpi-icon blue"><ion-icon name="analytics-outline"></ion-icon></div><div><div class="kpi-value">{{ porcentaje }}%</div><div class="kpi-label">Asistencia General</div></div></div>
      <div class="kpi-card"><div class="kpi-icon green"><ion-icon name="checkmark-outline"></ion-icon></div><div><div class="kpi-value">{{ presentes }}</div><div class="kpi-label">Presentes</div></div></div>
      <div class="kpi-card"><div class="kpi-icon red"><ion-icon name="close-outline"></ion-icon></div><div><div class="kpi-value">{{ ausentes }}</div><div class="kpi-label">Ausencias</div></div></div>
      <div class="kpi-card"><div class="kpi-icon orange"><ion-icon name="time-outline"></ion-icon></div><div><div class="kpi-value">{{ atrasados }}</div><div class="kpi-label">Atrasos</div></div></div>
    </div>
    <div class="accordion-item" *ngFor="let a of asignaturas">
      <div class="accordion-header" [class.open]="isOpen(a.id)" (click)="toggle(a.id)">
        <div style="display:flex;align-items:center;gap:10px">
          <ion-icon name="book-outline" style="color:#1E3A5F;font-size:16px"></ion-icon>
          <span>{{ a.nombre }}</span>
          <span class="badge badge-info" style="margin-left:8px">{{ pct(a.registros) }}%</span>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-size:12px;color:#718096">{{ a.registros.length }} registros</span>
          <ion-icon name="chevron-down-outline" class="accordion-arrow" [class.open]="isOpen(a.id)"></ion-icon>
        </div>
      </div>
      <div class="accordion-body" *ngIf="isOpen(a.id)">
        <table class="data-table">
          <thead><tr><th>Fecha</th><th>Estado</th></tr></thead>
          <tbody>
            <tr *ngFor="let r of a.registros">
              <td style="font-size:12px;color:#718096">{{ r.fecha }}</td>
              <td><span class="badge" [ngClass]="badge(r.estado)">{{ r.estado }}</span></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</app-layout>
